!
!=========================================
! Configuration de R3
! Backup GLBP
!=========================================

hostname R3

!
! Interfaces
!

interface Ethernet0/0
 description Lien vers R2
 ip address 10.0.2.2 255.255.255.252
 no shutdown

interface Ethernet0/1
 description Lien vers R1
 ip address 10.0.1.2 255.255.255.252
 no shutdown

interface Ethernet0/2
 description LAN

 ip address 192.168.10.2 255.255.255.0

 glbp 1 ip 192.168.10.254
 glbp 1 priority 100
 glbp 1 preempt

 no shutdown

!
! Routage
!

ip route 10.0.0.0 255.255.255.252 10.0.1.1

!
end
write memory
